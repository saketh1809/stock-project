apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock-app
  template:
    metadata:
      labels:
        app: stock-app
    spec:
      containers:
      - name: stock-app
        image: gcr.io/PROJECT_ID/stock-app
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URI
          value: mongodb://mongodb:27017/stockapp
---
apiVersion: v1
kind: Service
metadata:
  name: stock-app-service
spec:
  type: LoadBalancer
  selector:
    app: stock-app
  ports:
  - port: 80
    targetPort: 5000
